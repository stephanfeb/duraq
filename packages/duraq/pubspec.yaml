name: duraq
description: A durable queuing system implemented in Dart, with a SQLite backend
version: 3.0.0
repository: https://github.com/stephanfeb/duraq

environment:
  # 3.2.0, not 3.0.0: sqlite3 2.2.0 — the oldest this package allows —
  # itself requires >=3.2.0, so the old claim could never be satisfied.
  # The CI job that builds on the advertised floor is what found it.
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  sqlite3: '>=2.2.0 <4.0.0' # 2.2.0 is where updatedRows replaced getUpdatedRows
  path: ^1.8.0
  uuid: ^4.0.0

dev_dependencies:
  lints: ^2.1.0
  test: '>=1.25.0 <2.0.0' # failures-only reporter, used by tool/verify.sh
