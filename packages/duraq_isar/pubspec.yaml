name: duraq_isar
description: Isar storage backend for DuraQ, the durable Dart queue
version: 2.0.0
repository: https://github.com/stephanfeb/duraq

environment:
  # 3.2.0, not 3.0.0: sqlite3 2.2.0 — the oldest this package allows —
  # itself requires >=3.2.0, so the old claim could never be satisfied.
  # The CI job that builds on the advertised floor is what found it.
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  # The two release together: this backend uses APIs added alongside the split.
  duraq: ^3.0.0
  isar: ^3.1.0+1
  uuid: ^4.0.0

dev_dependencies:
  lints: ^2.1.0
  test: '>=1.25.0 <2.0.0'
  path: ^1.8.0
  sqlite3: '>=2.2.0 <4.0.0'
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7

# Development against the duraq in this repository rather than the published
# one, so that a change to the shared StorageInterface is caught by this
# package's tests before it is released rather than after. Consumers never see
# this: pub honours overrides only in the root package.
#
# It is removed for publishing, and this package is run against the published
# duraq once before each release — otherwise the only thing ever tested is the
# working tree next door, which is not what anybody installs.
dependency_overrides:
  duraq:
    path: ../duraq

