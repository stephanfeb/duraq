# Runs the same gate as tool/verify.sh, so a green local run and a green CI run
# mean the same thing. It covers every package in the repository.
#
# Nothing has ever run here: the repository had no workflows before this file.
# It starts working on the first push, once Actions is enabled for the repo.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # The gate. A red run here means the branch is not fit to merge.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # verify.sh resolves each package itself; the Isar tests fetch the native
      # core on first use, so this job needs network access.
      - run: tool/verify.sh

  # Everything below reports, and none of it blocks.
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Builds on the floor both pubspecs advertise. Its first run found
          # that floor was wrong — sqlite3 needs 3.2.0, so the 3.0.0 claim
          # could never be satisfied — which is the whole point of running it.
          - name: oldest supported SDK
            sdk: '3.2'
            command: tool/verify.sh
          # The suites lean on real databases and wall-clock waits (finding Q6),
          # so one green run is weaker evidence than it looks. Repeating them
          # surfaces the flakes that only appear under load.
          - name: flake watch
            sdk: stable
            command: tool/verify.sh --flake 3
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: ${{ matrix.command }}
